    result:
      amount: 1

  # Ender Dragon Token Recipe
  ender_dragon:
    token: "ender_dragon"
    type: "shaped"
    pattern:
      - " D "
      - "DBD"
      - " D "
    ingredients:
      D: "DRAGON_BREATH"
      B: "DRAGON_EGG"
