# TokenSMP Crafting Recipes
# 
# Each recipe defines a shaped or shapeless crafting recipe for tokens.
# Format follows Minecraft's recipe JSON structure.

recipes:
  # Zombie Token Recipe
  zombie:
    token: "zombie"
    type: "shaped"
    pattern:
      - " R "
      - "RBR"
      - " R "
    ingredients:
      R: "ROTTEN_FLESH"
      B: "BONE"
    result:
      amount: 1

  # Skeleton Token Recipe
  skeleton:
    token: "skeleton"
    type: "shaped"
    pattern:
      - " B "
      - "BAB"
      - " B "
    ingredients:
      B: "BONE"
      A: "ARROW"
    result:
      amount: 1

  # Spider Token Recipe
  spider:
    token: "spider"
    type: "shaped"
    pattern:
      - " S "
      - "SES"
      - " S "
    ingredients:
      S: "STRING"
      E: "SPIDER_EYE"
    result:
      amount: 1

  # Creeper Token Recipe
  creeper:
