    result:
      amount: 1

  # Enderman Token Recipe
  enderman:
    token: "enderman"
    type: "shaped"
    pattern:
      - " E "
      - "EPE"
      - " E "
    ingredients:
      E: "ENDER_PEARL"
      P: "PURPUR_BLOCK"
    result:
