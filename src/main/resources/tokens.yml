# TokenSMP Token Definitions
# 
# Each token is defined by a unique ID and various properties.
# Do not modify the 'id' field after creation as it's used for data persistence.

tokens:
  # Example: Zombie Token
  zombie:
    id: "zombie"
    enabled: true
    display-name: "<gradient:#8fbc8f:#2e8b57>Zombie Token</gradient>"
    material: "ROTTEN_FLESH"
    rarity: "COMMON"
    lore:
      - "<gray>A token infused with the essence of the undead.</gray>"
      - ""
      - "<yellow>Primary Ability:</yellow> <white>Infect</white>"
      - "<gray>Infect nearby enemies with weakness.</gray>"
      - ""
      - "<yellow>Secondary Ability:</yellow> <white>Horde Call</white>"
      - "<gray>Summon zombie minions to fight for you.</gray>"
      - ""
      - "<gold>Rarity: COMMON</gold>"
    health: 20
    primary:
      ability: "infect"
      cooldown: "30s"
      mana-cost: 0
    secondary:
      ability: "horde_call"
      cooldown: "60s"
      mana-cost: 0

